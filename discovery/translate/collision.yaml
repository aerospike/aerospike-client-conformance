kind: collision
description: >-
  Translation collisions (FR-46). input is every peer advertised in one peers reply, in order; each
  is translated with the row's config. A peer has one host (host and port) or several (hosts, in
  advertised order). Two addresses are the same when their host and port match after translation,
  with hostnames compared case-insensitively and no DNS resolution, and every shared address of the
  reply is found before any is removed. A shared address is never used. A peer that still has an
  address of its own is created through it; a peer whose every address is shared becomes no node
  and is reported once in a collision. The message names the peer, every shared address of the
  peer as the peer advertised it after translation with the node that owns each (the first three,
  then "and N more"), and the translator. An expected error gives the peer's first shared address in
  advertised order, which is always among the three listed. An expected error with two nodeNames
  needs that pair reported; one with a single name needs that peer reported in some collision on
  that host and port, paired with any other peer. expect.nodes is the node names that become nodes;
  expect.errors lists only collided peers, though a created peer can appear in another peer's
  collision message. An address that answers as another node after connect (FR-47) needs a real
  connection, so these rows do not cover it.
rows:
  - case: static-map-two-hosts-one-target
    because: Two hosts mapped to one host on the same port create neither node, and a peer with its own mapping is still created.
    config:
      translation:
        {
          provider: static-map,
          static_map:
            {
              "10.0.0.1": 203.0.113.1,
              "10.0.0.2": 203.0.113.1,
              "10.0.0.3": 203.0.113.3,
            },
        }
    input:
      [
        {
          nodeName: BB9020011AC4202,
          tlsName: db1.example.com,
          host: 10.0.0.1,
          port: 3000,
          sourceList: standard,
        },
        {
          nodeName: BB9030011AC4202,
          tlsName: db2.example.com,
          host: 10.0.0.2,
          port: 3000,
          sourceList: standard,
        },
        {
          nodeName: BB9040011AC4202,
          tlsName: db3.example.com,
          host: 10.0.0.3,
          port: 3000,
          sourceList: standard,
        },
      ]
    expect:
      nodes: [BB9040011AC4202]
      errors:
        - category: translation-collision
          messageContains:
            {
              nodeNames: [BB9020011AC4202, BB9030011AC4202],
              host: 203.0.113.1,
              port: 3000,
              translator: static-map,
            }

  - case: port-map-two-keys-one-value
    because: Two keys whose values are the same host:port create neither node.
    config:
      translation:
        provider: port-map
        port_map:
          {
            "10.0.0.1:3000": lb.example.com:30001,
            "10.0.0.2:3000": lb.example.com:30001,
          }
    input:
      [
        {
          nodeName: BB9020011AC4202,
          tlsName: db1.example.com,
          host: 10.0.0.1,
          port: 3000,
          sourceList: standard,
        },
        {
          nodeName: BB9030011AC4202,
          tlsName: db2.example.com,
          host: 10.0.0.2,
          port: 3000,
          sourceList: standard,
        },
      ]
    expect:
      nodes: []
      errors:
        - category: translation-collision
          messageContains:
            {
              nodeNames: [BB9020011AC4202, BB9030011AC4202],
              host: lb.example.com,
              port: 30001,
              translator: port-map,
            }

  - case: pass-through-same-advertised-endpoint
    because: Two peers advertising the same host and port create neither node.
    config:
      translation: { provider: pass-through }
    input:
      [
        {
          nodeName: BB9020011AC4202,
          tlsName: db1.example.com,
          host: as.priv.example.com,
          port: 31001,
          sourceList: alternate,
        },
        {
          nodeName: BB9030011AC4202,
          tlsName: db2.example.com,
          host: as.priv.example.com,
          port: 31001,
          sourceList: alternate,
        },
      ]
    expect:
      nodes: []
      errors:
        - category: translation-collision
          messageContains:
            {
              nodeNames: [BB9020011AC4202, BB9030011AC4202],
              host: as.priv.example.com,
              port: 31001,
              translator: pass-through,
            }

  - case: shared-host-distinct-ports
    because: Peers on one host with different ports do not collide, so every peer is created.
    config:
      translation: { provider: pass-through }
    input:
      [
        {
          nodeName: BB9020011AC4202,
          tlsName: db1.example.com,
          host: as.priv.example.com,
          port: 31001,
          sourceList: alternate,
        },
        {
          nodeName: BB9030011AC4202,
          tlsName: db2.example.com,
          host: as.priv.example.com,
          port: 31002,
          sourceList: alternate,
        },
      ]
    expect:
      nodes: [BB9020011AC4202, BB9030011AC4202]
      errors: []

  - case: three-peers-one-endpoint
    because: Three peers on one host and port create no node, and each peer is reported in a collision. FR-46 names two peers per error, so which other peer each is paired with is left to the client.
    config:
      translation: { provider: pass-through }
    input:
      [
        {
          nodeName: BB9020011AC4202,
          tlsName: db1.example.com,
          host: as.priv.example.com,
          port: 31001,
          sourceList: alternate,
        },
        {
          nodeName: BB9030011AC4202,
          tlsName: db2.example.com,
          host: as.priv.example.com,
          port: 31001,
          sourceList: alternate,
        },
        {
          nodeName: BB9040011AC4202,
          tlsName: db3.example.com,
          host: as.priv.example.com,
          port: 31001,
          sourceList: alternate,
        },
      ]
    expect:
      nodes: []
      errors:
        - category: translation-collision
          messageContains:
            {
              nodeNames: [BB9020011AC4202],
              host: as.priv.example.com,
              port: 31001,
              translator: pass-through,
            }
        - category: translation-collision
          messageContains:
            {
              nodeNames: [BB9030011AC4202],
              host: as.priv.example.com,
              port: 31001,
              translator: pass-through,
            }
        - category: translation-collision
          messageContains:
            {
              nodeNames: [BB9040011AC4202],
              host: as.priv.example.com,
              port: 31001,
              translator: pass-through,
            }

  - case: hostname-and-its-address
    because: A peer advertising a hostname and a peer advertising the address it resolves to, on the same port, reach the same endpoint.
    state: blocked
    blockedBy: FR-46 compares without DNS resolution, so the two peers do not collide before connect; FR-47 decides after connect, by the node the shared endpoint answers as, and a collision row has no connection to assert that
    config:
      translation: { provider: pass-through }
    input:
      [
        {
          nodeName: BB9020011AC4202,
          tlsName: db1.example.com,
          host: node1.priv.example.com,
          port: 3000,
          sourceList: alternate,
        },
        {
          nodeName: BB9030011AC4202,
          tlsName: db2.example.com,
          host: 10.0.0.1,
          port: 3000,
          sourceList: standard,
        },
      ]

  - case: newcomer-collides-with-existing-node
    because: The first peer is a node the client already holds and the second, new in a later reply, translates to its host and port.
    state: blocked
    blockedBy: FR-46 and FR-47 now say the existing node keeps its address and the newcomer is reported, but a collision row models one peers reply and cannot mark a peer as already a node
    config:
      translation:
        {
          provider: static-map,
          static_map: { "10.0.0.1": 203.0.113.1, "10.0.0.2": 203.0.113.1 },
        }
    input:
      [
        {
          nodeName: BB9020011AC4202,
          tlsName: db1.example.com,
          host: 10.0.0.1,
          port: 3000,
          sourceList: standard,
        },
        {
          nodeName: BB9030011AC4202,
          tlsName: db2.example.com,
          host: 10.0.0.2,
          port: 3000,
          sourceList: standard,
        },
      ]

  - case: partial-overlap-keeps-own-addresses
    because: A peer keeps its own addresses when another peer shares one of them. A client that rejects a peer on any shared address fails this row.
    config:
      translation: { provider: pass-through }
    input:
      [
        {
          nodeName: BB9020011AC4202,
          tlsName: db1.example.com,
          hosts:
            [
              { host: as.priv.example.com, port: 31001 },
              { host: as.priv.example.com, port: 31002 },
            ],
          sourceList: alternate,
        },
        {
          nodeName: BB9030011AC4202,
          tlsName: db2.example.com,
          hosts:
            [
              { host: as.priv.example.com, port: 31001 },
              { host: as.priv.example.com, port: 31003 },
            ],
          sourceList: alternate,
        },
      ]
    expect:
      nodes: [BB9020011AC4202, BB9030011AC4202]
      errors: []

  - case: port-map-partial-overlap
    because: Two addresses mapped to one target are shared, but each peer keeps its other address, so both peers are created. A client that rejects a peer on any shared address fails this row.
    config:
      translation:
        provider: port-map
        port_map:
          {
            "10.0.0.1:3000": lb.example.com:30001,
            "10.0.0.2:3000": lb.example.com:30001,
            "10.0.0.3:3000": lb.example.com:30003,
            "10.0.0.4:3000": lb.example.com:30004,
          }
    input:
      [
        {
          nodeName: BB9020011AC4202,
          tlsName: db1.example.com,
          hosts:
            [{ host: 10.0.0.1, port: 3000 }, { host: 10.0.0.3, port: 3000 }],
          sourceList: standard,
        },
        {
          nodeName: BB9030011AC4202,
          tlsName: db2.example.com,
          hosts:
            [{ host: 10.0.0.2, port: 3000 }, { host: 10.0.0.4, port: 3000 }],
          sourceList: standard,
        },
      ]
    expect:
      nodes: [BB9020011AC4202, BB9030011AC4202]
      errors: []

  - case: static-map-one-side-overlap
    because: Only the peer left with no address of its own is reported; the peer that keeps an address is created.
    config:
      translation:
        {
          provider: static-map,
          static_map:
            {
              "10.0.0.1": 203.0.113.1,
              "10.0.0.2": 203.0.113.1,
              "10.0.0.3": 203.0.113.3,
            },
        }
    input:
      [
        {
          nodeName: BB9020011AC4202,
          tlsName: db1.example.com,
          hosts:
            [{ host: 10.0.0.1, port: 3000 }, { host: 10.0.0.3, port: 3000 }],
          sourceList: standard,
        },
        {
          nodeName: BB9030011AC4202,
          tlsName: db2.example.com,
          hosts: [{ host: 10.0.0.2, port: 3000 }],
          sourceList: standard,
        },
      ]
    expect:
      nodes: [BB9020011AC4202]
      errors:
        - category: translation-collision
          messageContains:
            {
              nodeNames: [BB9030011AC4202],
              host: 203.0.113.1,
              port: 3000,
              translator: static-map,
            }

  - case: shared-found-before-removal
    because: B shares one address with A and the other with C, so B and C have no address of their own while A keeps 31003. Removing shared addresses one peer at a time, in reply order, would create all three. C uses host and port, so the row also mixes both peer forms.
    config:
      translation: { provider: pass-through }
    input:
      [
        {
          nodeName: BB9020011AC4202,
          tlsName: db1.example.com,
          hosts:
            [
              { host: as.priv.example.com, port: 31001 },
              { host: as.priv.example.com, port: 31003 },
            ],
          sourceList: alternate,
        },
        {
          nodeName: BB9030011AC4202,
          tlsName: db2.example.com,
          hosts:
            [
              { host: as.priv.example.com, port: 31001 },
              { host: as.priv.example.com, port: 31002 },
            ],
          sourceList: alternate,
        },
        {
          nodeName: BB9040011AC4202,
          tlsName: db3.example.com,
          host: as.priv.example.com,
          port: 31002,
          sourceList: alternate,
        },
      ]
    expect:
      nodes: [BB9020011AC4202]
      errors:
        - category: translation-collision
          messageContains:
            {
              nodeNames: [BB9030011AC4202],
              host: as.priv.example.com,
              port: 31001,
              translator: pass-through,
            }
        - category: translation-collision
          messageContains:
            {
              nodeNames: [BB9040011AC4202],
              host: as.priv.example.com,
              port: 31002,
              translator: pass-through,
            }

  - case: shared-chain
    because: Each peer shares an address with the next, so every address is shared and no peer is created. B's message lists :31001 used by A and :31002 used by C; the row asserts its first shared address, :31001.
    config:
      translation: { provider: pass-through }
    input:
      [
        {
          nodeName: BB9020011AC4202,
          tlsName: db1.example.com,
          hosts: [{ host: as.priv.example.com, port: 31001 }],
          sourceList: alternate,
        },
        {
          nodeName: BB9030011AC4202,
          tlsName: db2.example.com,
          hosts:
            [
              { host: as.priv.example.com, port: 31001 },
              { host: as.priv.example.com, port: 31002 },
            ],
          sourceList: alternate,
        },
        {
          nodeName: BB9040011AC4202,
          tlsName: db3.example.com,
          hosts: [{ host: as.priv.example.com, port: 31002 }],
          sourceList: alternate,
        },
      ]
    expect:
      nodes: []
      errors:
        - category: translation-collision
          messageContains:
            {
              nodeNames: [BB9020011AC4202],
              host: as.priv.example.com,
              port: 31001,
              translator: pass-through,
            }
        - category: translation-collision
          messageContains:
            {
              nodeNames: [BB9030011AC4202],
              host: as.priv.example.com,
              port: 31001,
              translator: pass-through,
            }
        - category: translation-collision
          messageContains:
            {
              nodeNames: [BB9040011AC4202],
              host: as.priv.example.com,
              port: 31002,
              translator: pass-through,
            }

  - case: every-host-shared
    because: Two peers advertising the same set of addresses have no address of their own, so neither is created. Each peer is reported once, listing both shared addresses; the row asserts the pair on the first shared address. A client that reports each shared address as a separate collision fails the row on :31002.
    config:
      translation: { provider: pass-through }
    input:
      [
        {
          nodeName: BB9020011AC4202,
          tlsName: db1.example.com,
          hosts:
            [
              { host: as.priv.example.com, port: 31001 },
              { host: as.priv.example.com, port: 31002 },
            ],
          sourceList: alternate,
        },
        {
          nodeName: BB9030011AC4202,
          tlsName: db2.example.com,
          hosts:
            [
              { host: as.priv.example.com, port: 31001 },
              { host: as.priv.example.com, port: 31002 },
            ],
          sourceList: alternate,
        },
      ]
    expect:
      nodes: []
      errors:
        - category: translation-collision
          messageContains:
            {
              nodeNames: [BB9020011AC4202, BB9030011AC4202],
              host: as.priv.example.com,
              port: 31001,
              translator: pass-through,
            }

  - case: hostname-case-differs
    because: Hostnames compare case-insensitively, so A's only address is B's first address spelled in another case. A has no address of its own and is reported on the address as A advertised it, while B keeps :31002. A client that compares hostnames case-sensitively creates both peers.
    config:
      translation: { provider: pass-through }
    input:
      [
        {
          nodeName: BB9020011AC4202,
          tlsName: db1.example.com,
          host: AS.Priv.Example.com,
          port: 31001,
          sourceList: alternate,
        },
        {
          nodeName: BB9030011AC4202,
          tlsName: db2.example.com,
          hosts:
            [
              { host: as.priv.example.com, port: 31001 },
              { host: as.priv.example.com, port: 31002 },
            ],
          sourceList: alternate,
        },
      ]
    expect:
      nodes: [BB9030011AC4202]
      errors:
        - category: translation-collision
          messageContains:
            {
              nodeNames: [BB9020011AC4202],
              host: AS.Priv.Example.com,
              port: 31001,
              translator: pass-through,
            }
