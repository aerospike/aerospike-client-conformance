kind: collision
description: >-
  Translation collisions. input is every peer advertised in one peers reply, in order; each is
  translated with the row's config. Peers that translate to the same host and port become no
  node, and each colliding pair is reported with both node names, the shared host and port and the
  translator. expect.nodes is the node names that become nodes.
rows:
  - case: static-map-two-hosts-one-target
    because: Two hosts mapped to one host on the same port create neither node, and a peer with its own mapping is still created.
    config:
      translation:
        {
          provider: static-map,
          static_map:
            {
              "10.0.0.1": 203.0.113.1,
              "10.0.0.2": 203.0.113.1,
              "10.0.0.3": 203.0.113.3,
            },
        }
    input:
      [
        {
          nodeName: BB9020011AC4202,
          tlsName: db1.example.com,
          host: 10.0.0.1,
          port: 3000,
          sourceList: standard,
        },
        {
          nodeName: BB9030011AC4202,
          tlsName: db2.example.com,
          host: 10.0.0.2,
          port: 3000,
          sourceList: standard,
        },
        {
          nodeName: BB9040011AC4202,
          tlsName: db3.example.com,
          host: 10.0.0.3,
          port: 3000,
          sourceList: standard,
        },
      ]
    expect:
      nodes: [BB9040011AC4202]
      errors:
        - category: translation-collision
          messageContains:
            {
              nodeNames: [BB9020011AC4202, BB9030011AC4202],
              host: 203.0.113.1,
              port: 3000,
              translator: static-map,
            }

  - case: port-map-two-keys-one-value
    because: Two keys whose values are the same host:port create neither node.
    config:
      translation:
        provider: port-map
        port_map:
          {
            "10.0.0.1:3000": lb.example.com:30001,
            "10.0.0.2:3000": lb.example.com:30001,
          }
    input:
      [
        {
          nodeName: BB9020011AC4202,
          tlsName: db1.example.com,
          host: 10.0.0.1,
          port: 3000,
          sourceList: standard,
        },
        {
          nodeName: BB9030011AC4202,
          tlsName: db2.example.com,
          host: 10.0.0.2,
          port: 3000,
          sourceList: standard,
        },
      ]
    expect:
      nodes: []
      errors:
        - category: translation-collision
          messageContains:
            {
              nodeNames: [BB9020011AC4202, BB9030011AC4202],
              host: lb.example.com,
              port: 30001,
              translator: port-map,
            }

  - case: pass-through-same-advertised-endpoint
    because: Two peers advertising the same host and port create neither node.
    config:
      translation: { provider: pass-through }
    input:
      [
        {
          nodeName: BB9020011AC4202,
          tlsName: db1.example.com,
          host: as.priv.example.com,
          port: 31001,
          sourceList: alternate,
        },
        {
          nodeName: BB9030011AC4202,
          tlsName: db2.example.com,
          host: as.priv.example.com,
          port: 31001,
          sourceList: alternate,
        },
      ]
    expect:
      nodes: []
      errors:
        - category: translation-collision
          messageContains:
            {
              nodeNames: [BB9020011AC4202, BB9030011AC4202],
              host: as.priv.example.com,
              port: 31001,
              translator: pass-through,
            }

  - case: shared-host-distinct-ports
    because: Peers on one host with different ports do not collide, so every peer is created.
    config:
      translation: { provider: pass-through }
    input:
      [
        {
          nodeName: BB9020011AC4202,
          tlsName: db1.example.com,
          host: as.priv.example.com,
          port: 31001,
          sourceList: alternate,
        },
        {
          nodeName: BB9030011AC4202,
          tlsName: db2.example.com,
          host: as.priv.example.com,
          port: 31002,
          sourceList: alternate,
        },
      ]
    expect:
      nodes: [BB9020011AC4202, BB9030011AC4202]
      errors: []

  - case: three-peers-one-endpoint
    because: Three peers on one host and port create no node, and every colliding pair is reported.
    config:
      translation: { provider: pass-through }
    input:
      [
        {
          nodeName: BB9020011AC4202,
          tlsName: db1.example.com,
          host: as.priv.example.com,
          port: 31001,
          sourceList: alternate,
        },
        {
          nodeName: BB9030011AC4202,
          tlsName: db2.example.com,
          host: as.priv.example.com,
          port: 31001,
          sourceList: alternate,
        },
        {
          nodeName: BB9040011AC4202,
          tlsName: db3.example.com,
          host: as.priv.example.com,
          port: 31001,
          sourceList: alternate,
        },
      ]
    expect:
      nodes: []
      errors:
        - category: translation-collision
          messageContains:
            {
              nodeNames: [BB9020011AC4202, BB9030011AC4202],
              host: as.priv.example.com,
              port: 31001,
              translator: pass-through,
            }
        - category: translation-collision
          messageContains:
            {
              nodeNames: [BB9020011AC4202, BB9040011AC4202],
              host: as.priv.example.com,
              port: 31001,
              translator: pass-through,
            }
        - category: translation-collision
          messageContains:
            {
              nodeNames: [BB9030011AC4202, BB9040011AC4202],
              host: as.priv.example.com,
              port: 31001,
              translator: pass-through,
            }

  - case: hostname-and-its-address
    because: A peer advertising a hostname and a peer advertising the address it resolves to, on the same port, reach the same endpoint.
    state: blocked
    blockedBy: the collision rule compares translated host and port and does not say whether a hostname and the address it resolves to are the same host, and the row cannot assert either without the runner's resolver
    config:
      translation: { provider: pass-through }
    input:
      [
        {
          nodeName: BB9020011AC4202,
          tlsName: db1.example.com,
          host: node1.priv.example.com,
          port: 3000,
          sourceList: alternate,
        },
        {
          nodeName: BB9030011AC4202,
          tlsName: db2.example.com,
          host: 10.0.0.1,
          port: 3000,
          sourceList: standard,
        },
      ]

  - case: newcomer-collides-with-existing-node
    because: The first peer is a node the client already holds and the second, new in a later reply, translates to its host and port.
    state: blocked
    blockedBy: design P-11, the collision rule does not say what happens to a colliding peer that is already a node
    config:
      translation:
        {
          provider: static-map,
          static_map: { "10.0.0.1": 203.0.113.1, "10.0.0.2": 203.0.113.1 },
        }
    input:
      [
        {
          nodeName: BB9020011AC4202,
          tlsName: db1.example.com,
          host: 10.0.0.1,
          port: 3000,
          sourceList: standard,
        },
        {
          nodeName: BB9030011AC4202,
          tlsName: db2.example.com,
          host: 10.0.0.2,
          port: 3000,
          sourceList: standard,
        },
      ]
