kind: translate
description: >-
  endpoint-port-map translator. Every endpoint maps to one opaque hostname
  and a port derived from the node. No port function is agreed yet, so every row is
  blocked and carries inputs only.
rows:
  - case: ako-rack-infix-rack-1-pod-0
    because: AKO rack-infix node names are an explicit case of the port function.
    state: blocked
    blockedBy: no agreed default port function
    config:
      translation: { provider: endpoint-port-map, endpoint: { hostname: as.example.com, portBase: 30000 } }
    input: { nodeName: 1a0, tlsName: cluster.example.com, host: 10.0.1.7, port: 3000, sourceList: standard }

  - case: ako-rack-infix-rack-1-pod-2
    because: A higher pod ordinal in the same rack must give a distinct port.
    state: blocked
    blockedBy: no agreed default port function
    config:
      translation: { provider: endpoint-port-map, endpoint: { hostname: as.example.com, portBase: 30000 } }
    input: { nodeName: 1a2, tlsName: cluster.example.com, host: 10.0.1.9, port: 3000, sourceList: standard }

  - case: ako-rack-infix-rack-2-pod-0
    because: The same pod ordinal in another rack must not collide with rack 1.
    state: blocked
    blockedBy: no agreed default port function
    config:
      translation: { provider: endpoint-port-map, endpoint: { hostname: as.example.com, portBase: 30000 } }
    input: { nodeName: 2a0, tlsName: cluster.example.com, host: 10.0.2.7, port: 3000, sourceList: standard }

  - case: hex-node-name
    because: Server-generated hex node names are an explicit case of the port function.
    state: blocked
    blockedBy: no agreed default port function
    config:
      translation: { provider: endpoint-port-map, endpoint: { hostname: as.example.com, portBase: 30000 } }
    input: { nodeName: BB9020011AC4202, tlsName: cluster.example.com, host: 10.0.1.7, port: 3000, sourceList: standard }

  - case: hex-node-name-null-tls-name
    because: A null tlsName must stay null through endpoint-port-map.
    state: blocked
    blockedBy: no agreed default port function
    config:
      translation: { provider: endpoint-port-map, endpoint: { hostname: as.example.com, portBase: 30000 } }
    input: { nodeName: BB9030011AC4202, tlsName: null, host: 10.0.1.8, port: 3000, sourceList: standard }

  - case: alternate-source-list
    because: The port function must not depend on which list advertised the endpoint.
    state: blocked
    blockedBy: no agreed default port function
    config:
      translation: { provider: endpoint-port-map, endpoint: { hostname: as.example.com, portBase: 30000 } }
    input: { nodeName: 1a0, tlsName: cluster.example.com, host: 198.51.100.1, port: 3000, sourceList: alternate }

  - case: unparseable-node-name-fails-loudly
    because: A node name the port function cannot parse must fail loudly, never map to portBase.
    state: blocked
    blockedBy: no agreed default port function
    config:
      translation: { provider: endpoint-port-map, endpoint: { hostname: as.example.com, portBase: 30000 } }
    input: { nodeName: not-a-node-id, tlsName: cluster.example.com, host: 10.0.1.7, port: 3000, sourceList: standard }
