name: Test report actions

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Unit tests
        run: |
          pip install -r .github/actions/collect-conformance-report/requirements.txt
          python3 -W error -m unittest discover .github/actions/collect-conformance-report/tests -v
          python3 -W error -m unittest discover .github/actions/report-skipped-layers/tests -v

      - name: Write a report with every fixture case passing
        run: |
          mkdir reports
          python3 - > reports/conformance-report.json << 'EOF'
          import importlib.util, json
          spec = importlib.util.spec_from_file_location("cr", ".github/actions/collect-conformance-report/collect_report.py")
          cr = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(cr)
          version, cases = cr.load_fixtures(cr.Path("."))
          rows = [{"file": f, "case": c, "result": "blocked" if blocked else "pass"} for (f, c), blocked in cases.items()]
          print(json.dumps({"runtime": "smoke", "clientVersion": "0", "fixtureSetVersion": version, "counts": {}, "rows": rows}))
          EOF

      - name: Collect the report
        id: collect
        uses: ./.github/actions/collect-conformance-report
        with:
          reports-directory: reports
          fixtures-directory: .

      - name: Report one skipped layer
        id: one
        uses: ./.github/actions/report-skipped-layers
        with:
          layers: >-
            [{"layer": "L2 EE", "tests": "ee and ee cn-only profiles", "reason": "Enterprise feature key secret is absent"}]

      - name: Report no skipped layer
        id: none
        uses: ./.github/actions/report-skipped-layers
        with:
          layers: "[]"

      - name: Report an invalid row
        id: invalid
        continue-on-error: true
        uses: ./.github/actions/report-skipped-layers
        with:
          layers: '[{"layer": "L3", "tests": "kind and AKO tests"}]'

      - name: Check the outcomes
        env:
          GATE: ${{ steps.collect.outputs.gate }}
          ONE: ${{ steps.one.outputs.skipped-count }}
          NONE: ${{ steps.none.outputs.skipped-count }}
          INVALID: ${{ steps.invalid.outcome }}
          INVALID_COUNT: ${{ steps.invalid.outputs.skipped-count }}
        run: |
          [[ "$GATE" == success ]]
          [[ "$ONE" == 1 ]]
          [[ "$NONE" == 0 ]]
          [[ "$INVALID" == failure ]]
          [[ -z "$INVALID_COUNT" ]]
