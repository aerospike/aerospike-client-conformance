name: Test aws-real

on:
  pull_request:
    branches: [main]
    paths:
      - aws-real/**
      - .github/workflows/test-aws-real.yml
  push:
    branches: [main]
    paths:
      - aws-real/**
      - .github/workflows/test-aws-real.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check run.sh syntax
        run: bash -n aws-real/run.sh

      - name: Run check.py tests
        run: python3 -m unittest discover -s aws-real -v
