name: L2 proxy run

on:
  workflow_call:
    inputs:
      client-repository:
        description: Client repository on GitHub, owner/name
        type: string
        required: true
      commit:
        description: Client commit to build and run
        type: string
        required: true
      manifest:
        description: Manifest path in the client repository (l2-proxy/README.md)
        type: string
        required: true
      profile:
        description: >-
          Comma-separated profiles, or all: default, reachable, pass-through-names,
          pass-through-ports, port-map-range, port-range, low-mtu, idle-reset, unresolved-access,
          and cn-only on edition ee
        type: string
        required: false
        default: all
      rows:
        description: Comma-separated rows to run; empty runs every row of each profile
        type: string
        required: false
        default: ""
      edition:
        description: ee runs Aerospike Enterprise with the FEATURES_CONF secret, ce Aerospike Community
        type: string
        required: false
        default: ee
      server-image:
        description: Aerospike server image; empty uses the latest image of the edition
        type: string
        required: false
        default: ""
      unresolved-hostname:
        description: >-
          On pass-through-ports, which profile must then include, the shared alternate name does
          not resolve in the servers; needs a server-image that advertises access addresses verbatim
        type: boolean
        required: false
        default: false
      verbatim-access-address:
        description: >-
          On unresolved-access, which profile must then include, the server-image advertises access
          addresses verbatim instead of resolving them at startup
        type: boolean
        required: false
        default: false
      registry:
        description: >-
          Registry to log in to through JFrog OIDC before pulling server-image, such as
          aerospike.jfrog.io; empty pulls without logging in
        type: string
        required: false
        default: ""
      jfrog-platform-url:
        description: JFrog platform URL for the OIDC exchange, when registry is set
        type: string
        required: false
        default: https://aerospike.jfrog.io
      conformance-ref:
        description: Ref of aerospike/aerospike-client-conformance to run l2-proxy from
        type: string
        required: false
        default: main
    secrets:
      FEATURES_CONF:
        description: Enterprise feature-key file content, for edition ee
        required: false
      JFROG_OIDC_PROVIDER:
        description: JFrog OIDC provider name, when registry is set
        required: false
      JFROG_OIDC_AUDIENCE:
        description: JFrog OIDC audience, when registry is set
        required: false

permissions:
  contents: read

jobs:
  l2:
    name: L2 proxy (${{ inputs.edition }}, ${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout the harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aerospike/aerospike-client-conformance
          ref: ${{ inputs.conformance-ref }}
          path: conformance
          persist-credentials: false

      - name: Require JFrog OIDC
        if: ${{ inputs.registry != '' }}
        env:
          OIDC_PROVIDER: ${{ secrets.JFROG_OIDC_PROVIDER }}
          OIDC_AUDIENCE: ${{ secrets.JFROG_OIDC_AUDIENCE }}
        run: |
          if [[ -z "${OIDC_PROVIDER}" || -z "${OIDC_AUDIENCE}" ]]; then
            echo "::error::registry needs the JFROG_OIDC_PROVIDER and JFROG_OIDC_AUDIENCE secrets"
            exit 1
          fi

      - name: Set up JFrog CLI
        id: jfrog
        if: ${{ inputs.registry != '' }}
        uses: step-security/setup-jfrog-cli@a6b41f8338bea0983ddff6bd4ede7d2dcd81e1fa # v4.8.1
        env:
          JF_URL: ${{ inputs.jfrog-platform-url }}
        with:
          oidc-provider-name: ${{ secrets.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ secrets.JFROG_OIDC_AUDIENCE }}

      - name: Log in to the registry
        if: ${{ inputs.registry != '' }}
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ steps.jfrog.outputs.oidc-user }}
          password: ${{ steps.jfrog.outputs.oidc-token }}

      - name: Write the feature key
        if: ${{ inputs.edition == 'ee' }}
        env:
          FEATURES_CONF: ${{ secrets.FEATURES_CONF }}
        run: |
          set -euo pipefail
          if [[ -z "${FEATURES_CONF}" ]]; then
            echo "::error::edition ee needs the FEATURES_CONF secret"
            exit 1
          fi
          umask 077
          printf '%s\n' "${FEATURES_CONF}" > "${RUNNER_TEMP}/features.conf"

      - name: Run L2
        env:
          CLIENT_REPOSITORY: ${{ inputs.client-repository }}
          COMMIT: ${{ inputs.commit }}
          MANIFEST: ${{ inputs.manifest }}
          PROFILE: ${{ inputs.profile }}
          ROWS: ${{ inputs.rows }}
          EDITION: ${{ inputs.edition }}
          SERVER_IMAGE: ${{ inputs.server-image }}
          UNRESOLVED_HOSTNAME: ${{ inputs.unresolved-hostname }}
          VERBATIM_ACCESS_ADDRESS: ${{ inputs.verbatim-access-address }}
        run: |
          set -euo pipefail
          args=(
            --client-repo "https://github.com/${CLIENT_REPOSITORY}"
            --commit "${COMMIT}"
            --manifest "${MANIFEST}"
            --profile "${PROFILE}"
            --edition "${EDITION}"
            --results "${RUNNER_TEMP}/l2-proxy-results"
          )
          [[ -z "${ROWS}" ]] || args+=(--rows "${ROWS}")
          [[ -z "${SERVER_IMAGE}" ]] || args+=(--server-image "${SERVER_IMAGE}")
          [[ "${UNRESOLVED_HOSTNAME}" != "true" ]] || args+=(--unresolved-hostname)
          [[ "${VERBATIM_ACCESS_ADDRESS}" != "true" ]] || args+=(--verbatim-access-address)
          if [[ "${EDITION}" == "ee" ]]; then
            export FEATURES_CONF_PATH="${RUNNER_TEMP}/features.conf"
          fi
          conformance/l2-proxy/run.sh "${args[@]}"

      - name: Remove the feature key
        if: ${{ always() }}
        run: rm -f "${RUNNER_TEMP}/features.conf"

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l2-proxy-results-${{ inputs.edition }}-${{ inputs.profile }}${{ inputs.unresolved-hostname && '-unresolved-hostname' || '' }}${{ inputs.verbatim-access-address && '-verbatim' || '' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/l2-proxy-results
          if-no-files-found: warn
