# Publishes the fixture set to JFrog (database-generic-dev-local) as
# aerospike-client-conformance-<version>.zip, for client CI to download.
# Pull requests run the same build as a dry run.

name: Release

on:
  push:
    tags: [v*]
  pull_request:
    branches: [main]
  # Manual runs publish the existing tag for VERSION on the selected branch.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The tag must exist and match VERSION at that tag.
      - name: Resolve version
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            push) ref="$GITHUB_REF_NAME" ;;
            workflow_dispatch) ref="v$(tr -d '[:space:]' < VERSION)" ;;
            *) ref="$GITHUB_SHA" ;;
          esac
          if [ "$EVENT" != pull_request ]; then
            if ! echo "$ref" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::$ref is not a vMAJOR.MINOR.PATCH tag"
              exit 1
            fi
            git rev-parse -q --verify "refs/tags/$ref" >/dev/null || { echo "::error::tag $ref does not exist"; exit 1; }
          fi
          version=$(git show "$ref:VERSION" | tr -d '[:space:]')
          if [ "$EVENT" != pull_request ] && [ "v$version" != "$ref" ]; then
            echo "::error::tag $ref does not match VERSION $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to JFrog
    needs: version
    uses: aerospike/shared-workflows/.github/workflows/reusable_artifacts-cicd.yaml@b4b1e9dc89314a2d542f9d6fe0ee150ad06f9860 # v5.0.0
    with:
      gh-workflows-ref: b4b1e9dc89314a2d542f9d6fe0ee150ad06f9860 # v5.0.0, must match the ref above
      jf-project: database
      jf-build-name: aerospike-client-conformance
      version: ${{ needs.version.outputs.version }}
      gh-source-ref: ${{ needs.version.outputs.ref }}
      gh-artifact-directory: dist
      build-type: release
      oidc-provider-name: gh-aerospike
      oidc-audience: aerospike
      dry-run: ${{ github.event_name == 'pull_request' }}
      setup-python: true
      python-version: "3.13"
      build-script: |
        set -euo pipefail
        pip install -r scripts/requirements.txt
        python scripts/validate-fixtures.py
        name="aerospike-client-conformance-${{ needs.version.outputs.version }}"
        mkdir -p dist
        git archive --format=zip --prefix="$name/" -o "dist/$name.zip" HEAD VERSION README.md LICENSE schema discovery tls
    secrets:
      gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
      gpg-key-pass: ${{ secrets.GPG_PASS }}
