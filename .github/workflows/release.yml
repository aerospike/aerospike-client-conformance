# Checks a v<VERSION> tag: it must match VERSION at the tagged commit and the fixtures must
# validate. Clients check the repository out at the tag; nothing is published elsewhere.

name: Release

on:
  push:
    tags: [v*]

permissions:
  contents: read

jobs:
  check:
    name: Check release tag
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$TAG is not a vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          version=$(tr -d '[:space:]' < VERSION)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match VERSION $version"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Validate fixtures
        run: |
          pip install -r scripts/requirements.txt
          python scripts/validate-fixtures.py
