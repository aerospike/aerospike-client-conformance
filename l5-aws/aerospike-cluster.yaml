# Rendered by l5ctl install: @SIZE@, @IMAGE@, @MULTI_POD_PER_HOST@, @ZONE_A@, @ZONE_B@, @ZONE_C@ and
# @ALTERNATE_ACCESS@ are replaced, loadBalancerAlternateAccessAddress is added for
# networkLoadBalancer, and imagePullSecrets is added when a registry auth file is given.
apiVersion: asdb.aerospike.com/v1
kind: AerospikeCluster
metadata:
  name: aerocluster
  namespace: aerospike
spec:
  size: @SIZE@
  image: @IMAGE@
  podSpec:
    multiPodPerHost: @MULTI_POD_PER_HOST@
    nodeSelector:
      l5-aws/role: aerospike
    tolerations:
      - key: l5-aws/aerospike
        operator: Equal
        value: "true"
        effect: NoSchedule
    aerospikeContainer:
      resources:
        # More than half a 2 vCPU node, so each node holds one Aerospike pod and a scale-out waits
        # for a new node.
        requests:
          cpu: 1100m
          memory: 2Gi
  rackConfig:
    namespaces:
      - test
    racks:
      - id: 1
        zone: @ZONE_A@
      - id: 2
        zone: @ZONE_B@
      - id: 3
        zone: @ZONE_C@
  validationPolicy:
    skipWorkDirValidate: true
  aerospikeNetworkPolicy:
    access: pod
    alternateAccess: @ALTERNATE_ACCESS@
  storage:
    filesystemVolumePolicy:
      cascadeDelete: true
      initMethod: deleteFiles
    volumes:
      - name: workdir
        source:
          emptyDir: {}
        aerospike:
          path: /opt/aerospike
      - name: aerospike-config-secret
        source:
          secret:
            secretName: aerospike-secret
        aerospike:
          path: /etc/aerospike/secret
  aerospikeAccessControl:
    users:
      - name: admin
        secretName: auth-secret
        roles:
          - sys-admin
          - user-admin
          - data-admin
          - read-write
  aerospikeConfig:
    service:
      feature-key-file: /etc/aerospike/secret/features.conf
      work-directory: /opt/aerospike
      cgroup-mem-tracking: true
    security: {}
    network:
      service:
        port: 3000
      fabric:
        port: 3001
      heartbeat:
        port: 3002
    namespaces:
      - name: test
        replication-factor: 2
        storage-engine:
          type: memory
          data-size: 1073741824
